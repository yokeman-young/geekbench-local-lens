name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: unit tests (renderer, schemas, fixtures)
        run: python -m unittest discover -s tests -v
      - name: cli surface (no app required)
        run: |
          python -m gblens.cli --json view examples/results/sample-macbook-air-m5.gb7.json --html /tmp/out.html
          python -m gblens.cli --help
